name: Documentation

# Two jobs, and the split is the point.
#
# `build` runs on every pull request that touches the documentation, and it is a
# gate rather than a preview: VitePress fails the build on a link that resolves
# to nothing, and `docs/.vitepress/sidebar.ts` fails it on a page missing from
# the navigation or an entry missing its page. That covers what
# `tests/Project/SpecTest.php` cannot see, since it checks whether a path exists
# in the repository and this checks whether it exists as a page.
#
# It builds **two** sites: the line that is current, at the root, and one
# archive per superseded line, each read out of its own tag and published under
# a prefix (docs/.vitepress/versions.mjs).
#
# `deploy` publishes to GitHub Pages **from a tag**, never from a branch. The
# site describes what is installable, so a change merged to `main` and not yet
# tagged does not belong on it (CONTRIBUTING.md). A pull request and a push to
# `main` build the site and throw it away, which keeps the gate without
# publishing unreleased behaviour.
#
# `workflow_dispatch` is the escape hatch, and it does publish: it exists for a
# documentation fix that has to reach the site without minting a release.
#
# The tag pattern carries no `v`, because this repository's tags do not:
# 1.0.0, 1.0.1, 2.0.0-rc.1.
#
# No `paths` filter on `push`. A filter is evaluated against the commits a push
# introduces, and a tag push introduces none, so a filtered workflow would
# simply not run on the tag and the site would never publish. The build costs
# about twenty seconds.

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time, and a queued one is worth waiting for
# rather than cancelling: it carries a commit somebody merged.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Two reasons, and the second is load-bearing. The site prints the
          # date each page was last updated and reads it from the commit that
          # touched the file; and the build archives the previous line by
          # reading its documentation out of that line's **tag**, which a
          # shallow checkout does not carry
          # (docs/decisions/0112-the-site-documents-one-release-line.md).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/.vitepress/package-lock.json

      # `npm ci` rather than `install`: the lockfile decides, and a
      # documentation build has no business resolving a different tree from the
      # one that was reviewed.
      #
      # The postinstall step links docs/node_modules to the real directory
      # inside .vitepress/, which Vite needs in order to resolve anything at
      # all from a markdown file. See docs/.vitepress/postinstall.mjs.
      - name: Install
        run: npm --prefix docs/.vitepress ci

      - name: Build
        run: npm --prefix docs/.vitepress run build

      # Only when something is going to be published with it.
      - name: Upload the artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish to Pages
    runs-on: ubuntu-latest

    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
