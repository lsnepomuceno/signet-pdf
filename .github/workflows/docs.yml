name: Documentation

# Two jobs, and the split is the point.
#
# `build` runs on every pull request that touches the documentation, and it is a
# gate rather than a preview: VitePress fails the build on a link that resolves
# to nothing, and `docs/.vitepress/sidebar.ts` fails it on a page missing from
# the navigation or an entry missing its page. That covers what
# `tests/Project/SpecTest.php` cannot see, since it checks whether a path exists
# in the repository and this checks whether it exists as a page.
#
# `deploy` publishes to GitHub Pages, and only from the default branch. A pull
# request builds the site and throws it away.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time, and a queued one is worth waiting for
# rather than cancelling: it carries a commit somebody merged.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The site prints the date each page was last updated, and reads it
          # from the commit that touched the file.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/.vitepress/package-lock.json

      # `npm ci` rather than `install`: the lockfile decides, and a
      # documentation build has no business resolving a different tree from the
      # one that was reviewed.
      #
      # The postinstall step links docs/node_modules to the real directory
      # inside .vitepress/, which Vite needs in order to resolve anything at
      # all from a markdown file. See docs/.vitepress/postinstall.mjs.
      - name: Install
        run: npm --prefix docs/.vitepress ci

      - name: Build
        run: npm --prefix docs/.vitepress run build

      - name: Upload the artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish to Pages
    runs-on: ubuntu-latest

    needs: build
    if: github.event_name != 'pull_request'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
