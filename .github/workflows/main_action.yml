name: CI

# Pull requests targeting main, and main itself after a merge.
#
# The second is not the duplication it looks like. A pull request is tested
# against its own branch, not against main with it merged, so two branches that
# are each green can still produce a main that is not: on 2026-08-11 two of them
# were merged an hour apart, both touching the same test helper, and the merged
# result was only verified because someone ran the suite by hand.
#
# It is also what makes the README's test badge able to say anything: a badge
# reports the default branch, and until now the default branch had never been
# built.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  # head_ref is empty on a push, so fall back to the ref: without it every
  # push to main would share one group and cancel the run before it.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Superseding a pull request's run is a saving; superseding a main build is a
  # merge that never got verified, which is the whole reason main is built.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor is 8.4, for the constructs the codebase uses outright:
        # `new Reader()->parse()` without wrapping parentheses, and typed class
        # constants. 8.5 is the other end of the supported range.
        #
        # There is no framework axis any more. That was the second dimension of
        # this matrix and the reason a cell could fail at `composer update`
        # before a test ran (docs/decisions/0005-php-and-laravel-floor.md).
        php: [ '8.4', '8.5' ]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, openssl, sodium, json, gd, imagick, bcmath, zlib
          coverage: pcov

      - name: Validate PHP and Composer
        run: |
          php -v
          composer -V
          composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      # setup-php sets COMPOSER_NO_AUDIT, so advisories were silently not
      # checked. For a signing package a known vulnerability in the tree is
      # worth blocking on, and --abandoned=ignore keeps the gate about
      # vulnerabilities rather than about maintenance status.
      - name: Audit dependencies
        run: composer audit --abandoned=ignore

      # qpdf checks the structure of what the revision writer emits, and
      # poppler's pdfsig is the independent cross-check that has caught bugs
      # this suite passed straight through (docs/spec/invariants.md, rule 3).
      #
      # **Neither is pinned, and that is a decision.** A distribution pin
      # vanishes from the archive when the runner image advances, turning CI red
      # for a reason unrelated to the code, and the two ends already differ:
      # .docker carries qpdf 12.x from Alpine, the runners ship 11.x. So the
      # versions are recorded here instead, and `tests/Pest.php` refuses qpdf
      # output whose shape it cannot read rather than reporting a file with no
      # complaints.
      # Both are installed only when the runner image does not already carry
      # them, and the packages are cached, so the ordinary run touches no mirror
      # at all and never runs `apt-get update` to download an index that changes
      # nothing.
      #
      # The step timed out at six minutes on most pull requests, always on the
      # 8.4 leg while 8.5 passed in the same run, with nothing in the log before
      # the timeout (#72). The bounds already there could not catch it:
      # `Acquire::*::Timeout` bounds one request, so a mirror that answers
      # slowly rather than failing consumes the whole budget without ever
      # tripping a retry. `timeout` around each attempt is what turns that into
      # a retry instead of a dead job.
      #
      # The cache holds the .deb files rather than the installed binaries, so a
      # restore is a `dpkg -i` and nothing else. It is keyed on the runner image
      # version because a package built for one image need not install on the
      # next, and **every path degrades to the apt path**: a miss, a stale
      # archive, a dpkg that refuses, all fall through to the install that was
      # here before.
      - name: Restore the qpdf and poppler packages
        uses: actions/cache@v4
        with:
          path: /tmp/apt-packages
          # matrix.php is in the key so the two legs cannot race to save the
          # same entry. Two small caches beat a warning nobody reads.
          key: apt-qpdf-poppler-${{ env.ImageOS }}-${{ env.ImageVersion }}-php${{ matrix.php }}-v1

      - name: Install qpdf and poppler
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu

          have_both() {
            command -v qpdf >/dev/null 2>&1 && command -v pdfsig >/dev/null 2>&1
          }

          # Already in the image, which is the cheapest outcome and the one that
          # skips `apt-get update` entirely.
          if ! have_both && ls /tmp/apt-packages/*.deb >/dev/null 2>&1; then
            echo "Installing from the cached packages."
            # Not fatal: an archive built for an older image is a cache miss
            # with extra steps, and the apt path below still runs.
            sudo dpkg -i /tmp/apt-packages/*.deb || echo "The cached packages did not install; falling back to apt."
          fi

          if ! have_both; then
            missing=""
            command -v qpdf >/dev/null 2>&1 || missing="$missing qpdf"
            command -v pdfsig >/dev/null 2>&1 || missing="$missing poppler-utils"

            apt_get() {
              # ForceIPv4 because the runners reach some mirrors over IPv6 that
              # accept the connection and then never answer, which is the shape
              # of stall this step kept hitting.
              sudo timeout 100 apt-get \
                -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=15 \
                -o Acquire::Retries=2 \
                -o Acquire::ForceIPv4=true \
                -o DPkg::Lock::Timeout=120 \
                "$@"
            }

            # Three bounded attempts rather than one unbounded retry. A stalled
            # update is killed at 100 seconds and tried again, so the worst case
            # is five minutes of trying rather than six minutes of waiting.
            apt_get update -qq || apt_get update -qq || apt_get update -qq

            # Emptied first so the archive directory holds what this step
            # downloads and nothing an earlier step left behind: everything in
            # it is installed below, and installing a stranger's package would
            # be a surprise nobody asked for.
            sudo apt-get clean

            # Downloaded rather than installed, so what gets cached is exactly
            # what gets installed.
            # shellcheck disable=SC2086
            apt_get install -y -qq --no-install-recommends -d $missing

            sudo rm -rf /tmp/apt-packages
            sudo mkdir -p /tmp/apt-packages
            sudo cp /var/cache/apt/archives/*.deb /tmp/apt-packages/ 2>/dev/null || true
            # The cache is saved by the runner user, which cannot read a file
            # root wrote with the default mask.
            sudo chmod -R a+r /tmp/apt-packages

            sudo dpkg -i /tmp/apt-packages/*.deb
          fi

          # Unconditional, and the reason is --fail-on-skipped: a test whose
          # tool is missing calls markTestSkipped(), which the suite reports as
          # a failure somewhere unrelated to this step.
          qpdf --version | head -1
          pdfsig -v 2>&1 | head -1

      # veraPDF is the reference PDF/A validator and the only thing that can
      # establish a conformance verdict. Pinned rather than tracking "latest":
      # a validator that changes its verdicts between builds cannot be the
      # thing a gate is measured against.
      # See docs/decisions/0025-what-signing-does-to-pdf-a.md.
      - name: Install veraPDF
        env:
          VERAPDF_VERSION: '1.30.2'
        run: |
          set -eux
          curl -sSL -o /tmp/verapdf.zip \
            "https://software.verapdf.org/releases/${VERAPDF_VERSION%.*}/verapdf-greenfield-${VERAPDF_VERSION}-installer.zip"
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-src
          cat > /tmp/verapdf-auto.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
          <installpath>/opt/verapdf</installpath>
          </com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
          <pack index="0" name="veraPDF GUI" selected="true"/>
          <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
          <pack index="3" name="veraPDF Corpus and Tests" selected="false"/>
          <pack index="4" name="veraPDF Documentation" selected="false"/>
          <pack index="5" name="veraPDF Sample Plugins" selected="false"/>
          </com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar /tmp/verapdf-src/verapdf-greenfield-*/verapdf-izpack-installer-*.jar /tmp/verapdf-auto.xml
          sudo ln -s /opt/verapdf/verapdf /usr/local/bin/verapdf
          verapdf --version

      # The Arlington PDF Model, checked against the specification's own
      # grammar. Pinned by commit: the releases carry no binaries, and the TSV
      # model lives in the same tree, so one SHA pins tool and grammar together.
      # See docs/decisions/0037-what-we-write-against-the-grammar.md.
      - name: Install the Arlington PDF Model
        env:
          ARLINGTON_COMMIT: '9d75f6de8cdc3883d5519f83e804238329b9eb10'
        run: |
          set -eux
          git clone --quiet https://github.com/pdf-association/arlington-pdf-model.git /tmp/arlington
          cd /tmp/arlington
          git checkout --quiet "${ARLINGTON_COMMIT}"
          cd TestGrammar
          cmake -B build -DPDFSDK_PDFIUM=ON -DCMAKE_BUILD_TYPE=Release .
          cmake --build build --config Release -j"$(nproc)"
          sudo cp bin/linux/TestGrammar /usr/local/bin/testgrammar
          sudo mkdir -p /opt/arlington
          sudo cp -r /tmp/arlington/tsv /opt/arlington/tsv
          echo "ARLINGTON_TSV=/opt/arlington/tsv/latest" >> "$GITHUB_ENV"
          testgrammar --help > /dev/null

      # pyHanko is the reader that enforces /DocMDP, which pdfsig cannot
      # surface at all. Pinned for the same reason veraPDF is.
      #
      # Two distributions: installing pyHanko alone gives no command, because
      # the CLI is packaged and versioned separately.
      # See docs/decisions/0031-certification-verified-by-a-reader.md.
      - name: Install pyHanko
        env:
          PYHANKO_VERSION: '0.36.2'
          PYHANKO_CLI_VERSION: '0.4.2'
        run: |
          set -eux
          python3 -m venv /opt/pyhanko
          /opt/pyhanko/bin/pip install --quiet \
            "pyHanko==${PYHANKO_VERSION}" "pyhanko-cli==${PYHANKO_CLI_VERSION}"
          sudo ln -s /opt/pyhanko/bin/pyhanko /usr/local/bin/pyhanko
          pyhanko --version

      # composer test carries --fail-on-skipped: every check has to run
      # somewhere, and a skip is how one quietly stops. The PDF/A group used to
      # skip itself when veraPDF was absent, and a job could go green having
      # validated nothing.
      - name: Run tests
        run: composer test -- --exclude-group=network

      # These reach a live timestamp authority, so an outage on their side is
      # not a defect in this package. Reported, never blocking.
      #
      # The profiles themselves are gated offline against
      # Testing\LocalTimestampAuthority, so what is left here is the only
      # question a local authority cannot answer: whether this package
      # interoperates with somebody else's
      # (docs/decisions/0027-the-transport-is-a-seam.md).
      - name: Run tests against a live timestamp authority
        id: interop
        continue-on-error: true
        run: vendor/bin/pest --group=network

      # continue-on-error hides the outcome behind a green tick, and that is how
      # three of these tests were committed broken, went green, and were noticed
      # only by someone reading the log. Non-blocking is the decision; invisible
      # was not.
      - name: Say how the live authority answered
        if: always()
        run: |
          if [ "${{ steps.interop.outcome }}" = "success" ]; then
            echo "### Live timestamp authority: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Live timestamp authority: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Not blocking, because an outage on a third party's side is not a defect here." >> "$GITHUB_STEP_SUMMARY"
            echo "It is still the only check on interoperability with a real authority, so read the step before assuming it was the weather." >> "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, openssl, sodium, json, gd, imagick, bcmath, zlib
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Check dependencies
        run: vendor/bin/composer-dependency-analyser

      - name: Check composer.json formatting
        run: composer normalize --dry-run

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # src/ is fully typed as of PR 5; the gate keeps it that way.
      - name: Check type coverage
        run: vendor/bin/pest --type-coverage --min=100
