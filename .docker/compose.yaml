# Local reproduction of the CI matrix.
#
#   docker compose -f .docker/compose.yaml run --rm php   composer install
#   docker compose -f .docker/compose.yaml run --rm php   vendor/bin/pest
#   docker compose -f .docker/compose.yaml run --rm php85 composer check
#
# This is not an optional convenience. The package floor is PHP 8.4 and a
# development host usually carries an older distribution PHP, so the container
# is where the suite actually runs. Every verification instrument the gates
# depend on (veraPDF, pyHanko, pdfsig, qpdf) lives in the image too.
#
# The `php` service (8.4 by default) covers day-to-day work; php85 covers the
# other end of the matrix. Each service keeps `vendor/` in its own named volume
# so switching PHP versions does not invalidate the other install.
#
# The project name is pinned. Compose derives it from the directory holding
# this file, which is `.docker` here and `.docker` in laravel-a1-pdf-sign too,
# so both repositories resolved to the project `docker` and **shared the
# vendor volumes**: installing here emptied the other checkout's container
# vendor/ of every Laravel package. Naming the project keeps the two installs
# apart.
name: signet-pdf

x-php: &php
  build:
    context: ..
    dockerfile: .docker/Dockerfile
  working_dir: /app
  volumes:
    - ../:/app
  environment:
    COMPOSER_CACHE_DIR: /tmp/composer-cache

services:
  php:
    <<: *php
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        PHP_VERSION: "8.4"
    volumes:
      - ../:/app
      - vendor-84:/app/vendor

  php85:
    <<: *php
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        PHP_VERSION: "8.5"
    volumes:
      - ../:/app
      - vendor-85:/app/vendor

volumes:
  vendor-84:
  vendor-85:
